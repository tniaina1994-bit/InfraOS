[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infraos-backend"
version = "0.2.0"
description = "InfraOS backend — FastAPI monolith + core library (GPLv3)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2",
                "pyyaml>=6", "psutil>=5", "python-jose[cryptography]>=3.3",
                "python-multipart>=0.0.9", "sqlalchemy>=2", "alembic>=1.13",
                "redis>=5", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
postgres = ["psycopg2-binary>=2.9"]

[tool.setuptools]
package-dir = {"" = "app/core"}

[tool.setuptools.packages.find]
where = ["app/core"]
include = ["infraos*"]

[tool.ruff]
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

server {
  listen 80;
  server_name _;
  root /usr/share/infraos/ui;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
  # OpenAPI/Swagger/ReDoc (spec point 24) — l'API les sert en racine
  location = /docs { proxy_pass http://127.0.0.1:8000/docs; proxy_set_header Host $host; }
  location = /redoc { proxy_pass http://127.0.0.1:8000/redoc; proxy_set_header Host $host; }
  location = /openapi.json { proxy_pass http://127.0.0.1:8000/openapi.json; proxy_set_header Host $host; }
  # HTTPS-ready (point 25) : decommenter apres depot des certificats
  # (Certbot ou module certificates), puis activer HSTS.
  # listen 443 ssl;
  # ssl_certificate /etc/infraos/certs/infraos.crt;
  # ssl_certificate_key /etc/infraos/certs/infraos.key;
  # add_header Strict-Transport-Security "max-age=31536000" always;
}
